<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCM Test User</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:400px;
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    margin-bottom:15px;
}

#status{
    color:green;
    margin-bottom:15px;
    font-weight:bold;
}

textarea{
    width:100%;
    height:120px;
    resize:none;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2196F3;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}
</style>
</head>
<body>

<div class="card">
    <h2>📱 FCM Test User</h2>

    <p id="status">Status : Connecting...</p>

    <textarea id="token" readonly placeholder="FCM Token"></textarea>

    <button id="copyBtn">Copy Token</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOrzxRn79EcwBFh8myZKJuUkT6g3aTUSc",
  authDomain: "fir-cm-9fd2f.firebaseapp.com",
  projectId: "fir-cm-9fd2f",
  storageBucket: "fir-cm-9fd2f.firebasestorage.app",
  messagingSenderId: "458196100887",
  appId: "1:458196100887:web:6d4b24a2f737592807f952"
};

const VAPID_KEY = "BP21N52SUKbTHE1wM5Brlc4hBdUfTJOFb_eq_AOftEqbdixVJzs-lQzcfTG1hmKMtPFJM2A-sGEycWlK0eEtLF0";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const messaging = getMessaging(app);

const status = document.getElementById("status");
const tokenBox = document.getElementById("token");
const copyBtn = document.getElementById("copyBtn");

copyBtn.onclick = () => {
  navigator.clipboard.writeText(tokenBox.value);
  alert("Token Copied");
};

async function start() {
  try {
    status.innerText = "Starting...";
    status.innerText = "Signing in...";
    if (!auth.currentUser) {
      await signInAnonymously(auth);
    }

    status.innerText = "Requesting permission...";
    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      status.innerText = "❌ Notification Permission Denied";
      return;
    }

    status.innerText = "Registering Service Worker...";
    const registration = await navigator.serviceWorker.register(
      "./firebase-messaging-sw.js",
      { scope: "./" }
    );

    status.innerText = "Getting FCM Token...";
    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: registration
    });

    if (!token) {
      status.innerText = "❌ Token পাওয়া যায়নি";
      return;
    }

    status.innerText = "Saving to Firestore...";

    tokenBox.value = token;

    await setDoc(doc(db, "users", token), {
      uid: auth.currentUser.uid,
      token,
      updatedAt: Date.now(),
      userAgent: navigator.userAgent
    }, { merge: true });

    status.innerText = "✅ Connected";

  } catch (e) {
    console.error(e);
    status.innerText = "❌ " + (e.code || "Error");
    alert(e.message);
  }
}

start();
</script>

</body>
</html>
